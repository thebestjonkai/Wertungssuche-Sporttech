name: Build und Tests

# Prueft bei jedem Push und bei jedem Pull Request, dass der Crawler
# kompiliert und die Tests gruen sind. Greift nicht auf sporttech.io zu -
# die Tests arbeiten mit den Beispieldateien unter crawler/samples.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Kompilieren und testen
        run: mvn --batch-mode --no-transfer-progress -f crawler/pom.xml verify

      - name: Testberichte hochladen
        # Auch bei roten Tests hochladen - dann sieht man, was schiefging.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testberichte
          path: crawler/target/surefire-reports/
          if-no-files-found: ignore

      - name: Datendateien auf Gueltigkeit pruefen
        # Stellt sicher, dass in docs/data kein kaputtes JSON liegt - sonst
        # wuerde die Website stillschweigend nichts anzeigen.
        run: python3 .github/scripts/daten_pruefen.py
