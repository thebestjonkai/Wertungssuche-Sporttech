<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trampolin-Wertungssuche</title>

<!--
  Diese Datei ist nur eine Weiche.

  Die eigentliche Website liegt in docs/. Steht GitHub Pages unter
  Settings -> Pages auf Branch "main" und Ordner "/docs", wird diese Datei
  nie ausgeliefert - dann ist docs/index.html direkt die Startseite, und
  das ist der saubere Zustand.

  Steht Pages dagegen auf "/ (root)", landet man hier. Ohne diese Datei
  würde GitHub die README.md als Startseite rendern, und von der Suche
  wäre nichts zu sehen. Darum die Weiterleitung.
-->
<!--
  Die Weiterleitung nimmt Suchanfrage und Anker mit, sonst geht bei einem
  geteilten Link wie ?name=müller der Name verloren. Das Skript steht im
  head und greift vor dem meta-refresh; das refresh ist nur die Notlösung
  für abgeschaltetes JavaScript.
-->
<script>
  (function () {
    var ziel = 'docs/' + window.location.search + window.location.hash;
    window.location.replace(ziel);
  })();
</script>
<meta http-equiv="refresh" content="0; url=docs/">
<link rel="canonical" href="docs/">

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #e8ecf1;
    color: #12161d;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0f1216; color: #e9eef4; }
    a { color: #8ca6ff; }
  }
  .kasten { text-align: center; padding: 2rem; }
  p { margin: 0 0 .75rem; }
</style>
</head>
<body>
  <div class="kasten">
    <p>Die Wertungssuche wird geladen&nbsp;…</p>
    <p><a href="docs/" id="weiter">Weiter zur Suche</a></p>
  </div>
  <script>
    // Auch der Notfall-Link soll die Suchanfrage mitnehmen.
    document.getElementById('weiter').href =
      'docs/' + window.location.search + window.location.hash;
  </script>
</body>
</html>
